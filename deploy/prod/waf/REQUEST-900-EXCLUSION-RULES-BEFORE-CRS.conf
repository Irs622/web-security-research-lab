# Exclusion rules SEBELUM CRS dievaluasi.
# Isi berdasarkan false positive nyata dari audit log selama mode DetectionOnly.
# Gunakan rentang ID 1000-9999 untuk rule lokal. Jangan matikan seluruh CRS.

# --- Contoh: lewati inspeksi argumen password di form login (rule SQLi/XSS) ---
# SecRule REQUEST_FILENAME "@streq /login" \
#     "id:1001,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:password,\
#     ctl:ruleRemoveTargetByTag=attack-xss;ARGS:password"

# --- Contoh: editor rich-text yang mengirim HTML sah ---
# SecRule REQUEST_FILENAME "@beginsWith /admin/posts" \
#     "id:1002,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetByTag=attack-xss;ARGS:content"

# --- Contoh: health check monitoring tidak perlu di-log ---
# SecRule REQUEST_FILENAME "@streq /healthz" \
#     "id:1003,phase:1,pass,nolog,ctl:ruleEngine=Off"

# --- Contoh: aktifkan exclusion bawaan CRS untuk platform tertentu ---
# (CRS v4 memakai plugin: https://github.com/coreruleset/wordpress-rule-exclusions-plugin)
