# Lab tuning scenario "PL2 tuned" — narrow exclusions derived from PL2 false positives
# in results/paranoia/pl2. Each exclusion removes ONE rule from ONE parameter on ONE path,
# never a whole rule group, so attack detection elsewhere is unaffected.
# Used only via docker-compose.tuned.yml; the default lab runs untuned CRS.

# Feedback form: Juice Shop answers 500 when the captcha is missing (application error,
# not data leakage) -> drop the outbound 5xx rule for this endpoint only.
# Free-text comment legitimately contains punctuation such as "I'd" and "5/5".
SecRule REQUEST_FILENAME "@beginsWith /api/Feedbacks" \
    "id:1101,phase:1,pass,nolog,\
    ctl:ruleRemoveById=950100,\
    ctl:ruleRemoveTargetById=932200;ARGS:json.comment,\
    ctl:ruleRemoveTargetById=942200;ARGS:json.comment"

# Product search: natural-language terms ("C# sticker", "1 or 2 bottles") trip two PL2
# SQLi heuristics on q. The remaining SQLi rules (942100 libinjection etc.) stay active on q.
# Deliberately NOT excluded: 950100 on search — the 500 for "O'Reilly" is a genuine symptom
# of Juice Shop's SQL injection flaw and should stay visible.
SecRule REQUEST_FILENAME "@streq /rest/products/search" \
    "id:1102,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=942440;ARGS:q,\
    ctl:ruleRemoveTargetById=942390;ARGS:q"
