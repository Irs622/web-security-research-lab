name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -v

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config -q
      - run: cp deploy/prod/.env.example deploy/prod/.env
      - run: docker compose -f deploy/prod/docker-compose.prod.yml --env-file deploy/prod/.env config -q

  waf-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait juice-shop waf
      - name: Benign request must pass
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
      - name: SQLi payload must be blocked
        run: test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/rest/products/search?q=%27%20OR%201%3D1--")" = "403"
      - name: XSS payload must be blocked
        run: test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/?q=%3Cscript%3Ealert(1)%3C%2Fscript%3E")" = "403"
      - if: always()
        run: docker compose down
